name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - if: runner.os == 'Windows'
        run: pnpm dist --publish never
      - if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:EMBERHOST_EXECUTABLE = (Resolve-Path '.\release\win-unpacked\EmberHost.exe').Path
          node scripts/electron-smoke.mjs
