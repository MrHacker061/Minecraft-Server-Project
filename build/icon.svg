<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">EmberHost</title>
  <desc id="desc">A dark atom orbit on an ember-green rounded square.</desc>
  <defs>
    <linearGradient id="ember" x1="74" y1="48" x2="448" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7ae69b"/>
      <stop offset="1" stop-color="#43b866"/>
    </linearGradient>
    <radialGradient id="shine" cx="0" cy="0" r="1" gradientTransform="translate(153 116) rotate(46) scale(255)">
      <stop stop-color="#ffffff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="28" y="28" width="456" height="456" rx="100" fill="url(#ember)"/>
  <rect x="29.5" y="29.5" width="453" height="453" rx="98.5" fill="url(#shine)" stroke="#c4ffd3" stroke-opacity=".35" stroke-width="3"/>
  <g fill="none" stroke="#0b1811" stroke-width="24">
    <ellipse cx="256" cy="256" rx="142" ry="58"/>
    <ellipse cx="256" cy="256" rx="142" ry="58" transform="rotate(60 256 256)"/>
