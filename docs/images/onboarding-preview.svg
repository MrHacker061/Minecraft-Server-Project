  <circle cx="153" cy="493" r="13" fill="none" stroke="#40505c"/><text x="153" y="497" text-anchor="middle" fill="#74808d" font-family="Segoe UI, sans-serif" font-size="10">3</text><text x="180" y="497" fill="#74808d" font-family="Segoe UI, sans-serif" font-size="11">Review &amp; create</text>
